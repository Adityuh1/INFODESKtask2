# =============================================================================
# docker-compose.yml — Tech-Debt Auditor
# =============================================================================
# Starts the backend API with a single command: docker-compose up --build
# =============================================================================

version: "3.9"

services:
  api:
    # Build the image from the Dockerfile in the current directory
    build:
      context: .
      dockerfile: Dockerfile

    # Name the running container
    container_name: tech-debt-auditor-api

    # Map host port 3001 → container port 3001
    # Access the app at http://localhost:3001
    ports:
      - "3001:3001"

    # Pass environment variables into the container
    # Reads from your local .env file (never committed to git)
    env_file:
      - .env

    # Restart policy: automatically restart if the container crashes
    restart: unless-stopped

    # Respect the Dockerfile HEALTHCHECK — compose waits for healthy status
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s