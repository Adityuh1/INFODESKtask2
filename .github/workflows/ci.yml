name: Continuous Integration

# Triggers when code is pushed to the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Existing Node Tests
        run: |
          npm ci
          node tests/test-crawler.js
          node tests/test-git-adapter.js

      - name: Build Docker Image
        run: docker build -t tech-debt-auditor:test .
      
      - name: Run Docker Container (Background)
        run: |
          # Start the container in detached mode (-d)
          docker run -d -p 3001:3001 --name api-container tech-debt-auditor:test
          # Give the Node server a few seconds to boot up
          sleep 5
      
      - name: Basic Validation / Smoke Test
        run: |
          # The --fail flag tells curl to throw an error if it doesn't get a 200 OK response
          curl --fail http://localhost:3001/api/health
      
      - name: Report Build Status
        if: always() # This ensures this step runs even if a previous step failed
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ BUILD AND TESTS PASSED SUCCESSFULLY!"
          else
            echo "BUILD OR TESTS FAILED!"
            echo "--- Docker Logs ---"
            docker logs api-container || true
          fi
